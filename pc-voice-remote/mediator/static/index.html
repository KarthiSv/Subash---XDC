<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PC Remote">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>PC Voice Remote</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #151922; --panel-2: #1d2230; --text: #eef1f7; --muted: #8a93a6;
    --accent: #4f8cff; --accent-2: #7a5cff; --ok: #2ecc71; --bad: #ff5d5d; --warn: #ffb347;
    --radius: 18px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f5f9; --panel: #ffffff; --panel-2: #eceff5; --text: #11151c; --muted: #616a7d; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
    max-width: 560px; margin: 0 auto; min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
    background: var(--panel); padding: 6px 12px; border-radius: 999px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .icon-btn { background: var(--panel); border: 0; color: var(--text); width: 38px; height: 38px;
    border-radius: 12px; font-size: 18px; }

  .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 10px 0 18px; }
  #mic { width: 148px; height: 148px; border-radius: 50%; border: 0; color: white; font-size: 54px;
    background: radial-gradient(circle at 30% 30%, var(--accent), var(--accent-2));
    box-shadow: 0 12px 40px rgba(79,140,255,.35); transition: transform .15s; }
  #mic:active { transform: scale(.96); }
  #mic.listening { animation: pulse 1.2s infinite; background: radial-gradient(circle at 30% 30%, #ff6b6b, #ff3d7f); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,61,127,.55); } 100% { box-shadow: 0 0 0 28px rgba(255,61,127,0); } }
  #hint { color: var(--muted); font-size: 14px; text-align: center; min-height: 20px; }
  #live { font-size: 18px; text-align: center; min-height: 26px; font-weight: 500; }

  form { display: flex; gap: 8px; margin-bottom: 18px; }
  #text { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--panel-2); border-radius: 14px; padding: 14px; font-size: 17px; }
  #text:focus { outline: 2px solid var(--accent); }
  .send { border: 0; border-radius: 14px; padding: 0 18px; font: inherit; font-weight: 600;
    color: white; background: var(--accent); }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid button { background: var(--panel); color: var(--text); border: 0; border-radius: 16px;
    padding: 12px 4px 10px; font: inherit; font-size: 12px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; }
  .grid button span { font-size: 22px; }
  .grid button:active { background: var(--panel-2); }
  .grid button.danger span { filter: hue-rotate(-30deg); }

  #log { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  #log li { background: var(--panel); border-radius: 14px; padding: 10px 14px; border-left: 4px solid var(--ok); }
  #log li.bad { border-left-color: var(--bad); }
  #log .said { font-weight: 600; }
  #log .reply { color: var(--muted); font-size: 14px; }

  dialog { border: 0; border-radius: var(--radius); background: var(--panel); color: var(--text);
    width: min(92vw, 460px); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  dialog input[type=text], dialog input[type=url], dialog input[type=password] { width: 100%; font: inherit;
    background: var(--panel-2); color: var(--text); border: 0; border-radius: 10px; padding: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .actions button { border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; }
  .primary { background: var(--accent); color: white; }
  .secondary { background: var(--panel-2); color: var(--text); }
  small { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>PC Remote</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="status"><div class="dot" id="dot"></div><span id="status">Connecting…</span></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
  </div>
</header>

<div class="mic-wrap">
  <button id="mic" aria-label="Hold to talk">🎙️</button>
  <div id="live"></div>
  <div id="hint">Tap and speak a command</div>
</div>

<form id="form" autocomplete="off">
  <input id="text" type="text" enterkeyhint="send" placeholder="Type or use 🎤 on the keyboard…">
  <button class="send" type="submit">Send</button>
</form>

<h2>Quick actions</h2>
<div class="grid" id="quick"></div>

<h2>Recent</h2>
<ul id="log"></ul>

<dialog id="settings">
  <h3 style="margin:0">Settings</h3>
  <label for="server">Mediator address</label>
  <input id="server" type="url" placeholder="(this page's address)">
  <label for="token">Access token</label>
  <input id="token" type="password" placeholder="shown when the mediator starts">
  <div class="row"><span>Speak replies out loud</span><input id="speak" type="checkbox"></div>
  <div class="row"><span>Send as soon as I stop talking</span><input id="autosend" type="checkbox" checked></div>
  <p><small>Tip: in Safari tap Share → <b>Add to Home Screen</b> to use this like an app.</small></p>
  <div class="actions">
    <button class="secondary" id="cancelSettings">Cancel</button>
    <button class="primary" id="saveSettings">Save</button>
  </div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("pcr." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("pcr." + k, JSON.stringify(v)); } catch {} },
  };

  // Pick the token up from ?token=... once, then hide it from the address bar.
  const params = new URLSearchParams(location.search);
  if (params.get("token")) { store.set("token", params.get("token")); history.replaceState(null, "", location.pathname); }

  const base = () => (store.get("server", "") || location.origin).replace(/\/$/, "");
  const headers = () => ({ "Content-Type": "application/json", "Authorization": "Bearer " + store.get("token", "") });

  const QUICK = [
    ["🔉", "Vol −", "volume down"], ["🔊", "Vol +", "volume up"], ["🔇", "Mute", "mute"], ["⏯️", "Play/Pause", "play pause"],
    ["🌐", "Chrome", "open chrome"], ["🎬", "Netflix", "open netflix in chrome"], ["▶️", "YouTube", "open youtube in chrome"], ["⛶", "Fullscreen", "full screen"],
    ["🔵", "BT on", "turn on bluetooth"], ["⚪", "BT off", "turn off bluetooth"], ["🔒", "Lock", "lock the pc"], ["🖥️", "Desktop", "show desktop"],
    ["😴", "Sleep", "sleep", true], ["🔄", "Restart", "restart", true], ["⏻", "Shut down", "shutdown", true], ["✋", "Cancel", "cancel shutdown"],
  ];
  for (const [icon, label, cmd, confirmIt] of QUICK) {
    const b = document.createElement("button");
    b.innerHTML = `<span>${icon}</span>${label}`;
    if (confirmIt) b.className = "danger";
    b.onclick = () => { if (!confirmIt || confirm(`${label} the PC?`)) send(cmd); };
    $("quick").appendChild(b);
  }

  function addLog(said, reply, ok) {
    const li = document.createElement("li");
    if (!ok) li.className = "bad";
    li.innerHTML = `<div class="said"></div><div class="reply"></div>`;
    li.querySelector(".said").textContent = said;
    li.querySelector(".reply").textContent = reply;
    $("log").prepend(li);
    while ($("log").children.length > 30) $("log").lastChild.remove();
  }

  function say(text) {
    if (!store.get("speak", false) || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }

  async function send(text) {
    text = (text || "").trim();
    if (!text) return;
    $("hint").textContent = "Sending…";
    try {
      const res = await fetch(base() + "/api/command", { method: "POST", headers: headers(), body: JSON.stringify({ text }) });
      const data = await res.json().catch(() => ({ ok: false, message: "Bad response from mediator" }));
      const reply = data.message || (data.ok ? "Done" : "Failed");
      addLog(text, (data.understood ? data.understood + " → " : "") + reply, data.ok);
      $("hint").textContent = data.ok ? "✓ " + reply : "✗ " + reply;
      if (navigator.vibrate) navigator.vibrate(data.ok ? 30 : [60, 40, 60]);
      say(reply);
      if (res.status === 401) openSettings();
    } catch (e) {
      addLog(text, "Can't reach the mediator: " + e.message, false);
      $("hint").textContent = "✗ Can't reach the mediator";
    }
  }

  $("form").onsubmit = (e) => { e.preventDefault(); const t = $("text").value; $("text").value = ""; send(t); };

  // ---- Voice ---------------------------------------------------------------
  // Safari's speech recognition needs HTTPS. Over plain http on the LAN we fall
  // back to the keyboard's own dictation mic, which works everywhere.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, finalText = "";
  if (SR && window.isSecureContext) {
    rec = new SR();
    rec.lang = navigator.language || "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    rec.onresult = (e) => {
      let interim = "";
      finalText = "";
      for (const r of e.results) (r.isFinal ? (finalText += r[0].transcript) : (interim += r[0].transcript));
      $("live").textContent = finalText || interim;
    };
    rec.onend = () => {
      listening = false; $("mic").classList.remove("listening");
      const t = (finalText || $("live").textContent).trim();
      if (!t) { $("hint").textContent = "Didn't catch that"; return; }
      if (store.get("autosend", true)) send(t); else $("text").value = t;
    };
    rec.onerror = (e) => { $("hint").textContent = "Mic error: " + e.error; };
  } else {
    $("hint").textContent = "Tap the mic, then the 🎤 on your keyboard";
  }

  $("mic").onclick = () => {
    if (!rec) { $("text").focus(); return; }
    if (listening) { rec.stop(); return; }
    finalText = ""; $("live").textContent = "";
    try { rec.start(); listening = true; $("mic").classList.add("listening"); $("hint").textContent = "Listening…"; }
    catch (e) { $("hint").textContent = "Mic unavailable: " + e.message; }
  };

  // ---- Status --------------------------------------------------------------
  async function poll() {
    try {
      const res = await fetch(base() + "/api/status", { headers: headers() });
      if (res.status === 401) { $("status").textContent = "Need token"; $("dot").className = "dot"; return; }
      const data = await res.json();
      const agent = data.agents && data.agents[0];
      $("dot").className = "dot" + (agent ? " on" : "");
      $("status").textContent = agent ? (agent.hostname || agent.name) + " online" : "PC offline";
    } catch { $("dot").className = "dot"; $("status").textContent = "No mediator"; }
  }
  poll(); setInterval(poll, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

  // ---- Settings ------------------------------------------------------------
  function openSettings() {
    $("server").value = store.get("server", "");
    $("token").value = store.get("token", "");
    $("speak").checked = store.get("speak", false);
    $("autosend").checked = store.get("autosend", true);
    $("settings").showModal();
  }
  $("settingsBtn").onclick = openSettings;
  $("cancelSettings").onclick = () => $("settings").close();
  $("saveSettings").onclick = () => {
    store.set("server", $("server").value.trim());
    store.set("token", $("token").value.trim());
    store.set("speak", $("speak").checked);
    store.set("autosend", $("autosend").checked);
    $("settings").close(); poll();
  };
  if (!store.get("token", "")) openSettings();
})();
</script>
</body>
</html>
