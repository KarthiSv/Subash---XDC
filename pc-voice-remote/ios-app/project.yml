# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: PCVoiceRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  PCVoiceRemote:
    type: application
    platform: iOS
    sources: [PCVoiceRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pcvoiceremote   # change "example" to anything unique
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PCVoiceRemote/Info.plist
      properties:
        CFBundleDisplayName: PC Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: PC Remote listens to your voice commands for your computer.
        NSSpeechRecognitionUsageDescription: PC Remote turns what you say into commands for your computer.
        NSLocalNetworkUsageDescription: PC Remote talks to the mediator running on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
